<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../FAVICON/favicon.ico" type="image/x-icon">
    <title>Imagens e Midias</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir este site em dispositivos diferentes ou simplesmente aumente e diminua o navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png">
        <img src="imagens/foto-g.png" alt="Imagem Flexivel">
    </picture>

    <h1>Reproduzindo Audio</h1>
    <p>Vamos aprender a reproduzir audios em HTML5</p>
    <audio preload="metadata" controls loop>
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        <!--isso serve para ter outros formatos e carregar de acordo com a compatibilidade do navegador, é tipo "se não der esse, tenta esse" serve para não ter que carregar tudo de uma vez só. No exemplo do video ele tem outras linhas
        <source src="midia/guanacast-33.ogg" type="audio/ogg">
        <source src="midia/guanacast-33.wav" type="audio/wav">
        -->
        <p>Infelizmente seu navegador não consegue reproduzir o audio.<br><a href="midia/guanacast-33.mp3">Clique aqui para baixar o arquivo.</a></p>
    </audio>

</body>
</html>
